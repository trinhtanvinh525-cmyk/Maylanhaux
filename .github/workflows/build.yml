name: Build NagakawaIR APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Project & App Icon
        run: |
          mkdir -p app/src/main/java/com/nagakawa/ir
          mkdir -p app/src/main/res/drawable
          if [ -f "MainActivity.kt" ]; then cp MainActivity.kt app/src/main/java/com/nagakawa/ir/MainActivity.kt; fi
          printf 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\nrootProject.name = "NagakawaIR"\ninclude(":app")\n' > settings.gradle.kts
          printf 'plugins {\n id("com.android.application") version "8.5.2" apply false\n id("org.jetbrains.kotlin.android") version "1.9.24" apply false\n}\n' > build.gradle.kts
          printf 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\n' > gradle.properties
          printf 'plugins {\n id("com.android.application")\n id("org.jetbrains.kotlin.android")\n}\nandroid {\n namespace = "com.nagakawa.ir"\n compileSdk = 34\n defaultConfig {\n applicationId = "com.nagakawa.ir"\n minSdk = 24\n targetSdk = 34\n versionCode = 2\n versionName = "2.0-LiquidGlass"\n }\n compileOptions {\n sourceCompatibility = JavaVersion.VERSION_17\n targetCompatibility = JavaVersion.VERSION_17\n }\n kotlinOptions { jvmTarget = "17" }\n}\ndependencies {}\n' > app/build.gradle.kts
          printf '<?xml version="1.0" encoding="utf-8"?>\n<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">\n <path android:fillColor="#0A1931" android:pathData="M0,0h108v108h-108z"/>\n <path android:fillColor="#0066FF" android:pathData="M18,18 C18,10 90,10 90,18 C98,18 98,90 90,90 C90,98 18,98 18,90 C10,90 10,18 18,18 Z"/>\n <path android:fillColor="#40FFFFFF" android:pathData="M22,20 L86,20 C90,20 92,24 92,28 L92,48 C70,56 38,56 16,48 L16,28 C16,24 18,20 22,20 Z"/>\n <path android:fillColor="#FFFFFF" android:pathData="M24,34 L84,34 C87,34 89,36 89,39 L89,58 C89,61 87,63 84,63 L24,63 C21,63 19,61 19,58 L19,39 C19,36 21,34 24,34 Z"/>\n <path android:fillColor="#0052CC" android:pathData="M26,54 L82,54 L82,58 L26,58 Z"/>\n <path android:fillColor="#00D2FF" android:pathData="M52,68 L56,68 L56,90 L52,90 Z M41,79 L67,79 L67,83 L41,83 Z M44,71 L64,87 L61,90 L41,74 Z M64,71 L44,87 L47,90 L67,74 Z"/>\n</vector>\n' > app/src/main/res/drawable/ic_launcher.xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n <uses-permission android:name="android.permission.TRANSMIT_IR" />\n <uses-feature android:name="android.hardware.consumerir" android:required="false" />\n <application android:allowBackup="true" android:label="Nagakawa IR" android:icon="@drawable/ic_launcher" android:roundIcon="@drawable/ic_launcher" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">\n <activity android:name=".MainActivity" android:exported="true">\n <intent-filter>\n <action android:name="android.intent.action.MAIN" />\n <category android:name="android.intent.category.LAUNCHER" />\n </intent-filter>\n </activity>\n </application>\n</manifest>\n' > app/src/main/AndroidManifest.xml

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: NagakawaIR-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
